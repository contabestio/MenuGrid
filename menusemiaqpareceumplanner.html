<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .base {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        grid-template-rows: auto 2fr 1.5fr auto;
        padding: 5vh;
        gap: 0.5vw;
        height: 97vh;
        width: 97vw;
        background-color: aquamarine;
        border-radius: 0px;
        box-sizing: border-box;
        grid-template-areas:
          "navbar  navbar   navbar   navbar"
          "sidebar main     main     main"
          "sidebar content1 content2 content3"
          "sidebar footer   footer   footer";
      }
      .item {
        background-color: white;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        border-radius: 4vh;
      }
      .a {
        grid-area: navbar;
        background-color: rgb(155, 194, 209);
      }
      .b {
        grid-area: sidebar;
        background-color: rgb(228, 241, 246);
      }
      .c {
        grid-area: main;
        background-color: rgb(142, 159, 211);
      }
      .cc {
        grid-area: content1;
        background-color: rgb(132, 220, 255);
      }
      .d {
        grid-area: content2;
        background-color: rgb(136, 188, 228);
      }
      .e {
        grid-area: content3;
        background-color: rgb(99, 245, 252);
      }
      .f {
        grid-area: footer;
        background-color: rgb(212, 243, 255);
      }

      .item2 {
        background-color: rgb(155, 194, 209);
      }
    </style>
  </head>
  <body>
    <div class="base">
      <div class="item a"><p>NAVBAR</p></div>
      <div class="item b"><p>SIDEBAR</p></div>
      <div class="item c"><p>MAIN</p></div>
      <div class="item cc"><p>CONTENT 1</p></div>
      <div class="item d"><p>CONTENT 2</p></div>
      <div class="item e"><p>CONTENT 3</p></div>
      <div class="item f"><p>FOOTER</p></div>
    </div>
  </body>
</html>
